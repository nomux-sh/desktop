version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        update-types: ["minor", "patch"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
    # The GPUI crates have exact pins of one snapshot. A person bumps them
    # together, with a headless test run and a run on a Mac.
    ignore:
      - dependency-name: "gpui-pre*"
    groups:
      cargo:
        update-types: ["minor", "patch"]
