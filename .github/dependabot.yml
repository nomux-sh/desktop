version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
  # The GPUI crates have exact pins of one snapshot. A person moves them
  # together, with a headless test run and a run on a Mac: close an update
  # that moves only one of them.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "build"
    labels: ["dependencies"]
