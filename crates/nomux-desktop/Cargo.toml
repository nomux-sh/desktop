[package]
name = "nomux-desktop"
description = "The desktop client of nomux: the window, the actions and the connection to the daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
nomux-client.workspace = true
nomux-desktop-model.workspace = true
nomux-desktop-theme.workspace = true
nomux-sidebar.workspace = true
nomux-term.workspace = true
nomux-term-view.workspace = true
tokio.workspace = true

[features]
# The option `--capture <file>`: writes a rendered frame to a PNG file. GPUI
# renders a window to an image only with its test support, thus no package
# has this feature.
frame-capture = ["gpui/test-support", "gpui_platform/test-support"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
